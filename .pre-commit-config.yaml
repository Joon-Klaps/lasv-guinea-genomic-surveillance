# .pre-commit-config.yaml
repos:
  # Python hooks
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3
        files: ^src/.*\.py$|^scripts/.*\.py$|^tests/.*\.py$
        exclude: ^(docs/|data/|output/|archive/)

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]
        files: ^src/.*\.py$|^scripts/.*\.py$|^tests/.*\.py$
        exclude: ^(docs/|data/|output/|archive/)

  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args: ["--max-line-length=88", "--extend-ignore=E203,W503"]
        files: ^src/.*\.py$|^scripts/.*\.py$|^tests/.*\.py$
        exclude: ^(docs/|data/|output/|archive/)

  # R hooks
  - repo: https://github.com/lorenzwalthert/precommit
    rev: v0.4.3
    hooks:
      - id: lintr
        files: ^src/.*\.R$|^scripts/.*\.R$|^R/.*\.R$
        exclude: ^(docs/|data/|output/|archive/|renv/)
        args: ["--linter=linters_with_defaults(line_length_linter(120))"]

  # Prettier for various file types
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: \.(md|markdown|yaml|yml|json|toml|css|scss|js|ts|jsx|tsx)$
        exclude: ^(data/|output/|archive/)

  # General hooks (optional but recommended)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        files: \.(py|R)$
      - id: end-of-file-fixer
        files: \.(py|R)$
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=5000"]
